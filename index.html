<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SahabatCFGF</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar" id="navbar" style="display:none;">
        <div class="nav-container">
            <h2 class="logo"><img src="sahabatcfgf.png" alt="Logo"> SahabatCFGF</h2>
            <div class="hamburger" onclick="toggleMobileNav()"><i class="fas fa-bars"></i></div>
            <div class="nav-links">
                <div class="dropdown">
                    <span>Kategori <i class="fas fa-caret-down"></i></span>
                    <div class="dropdown-content" id="cat-dropdown"></div>
                </div>
                <button onclick="toggleCart()" class="btn-glow"><i class="fas fa-shopping-bag"></i></button>
            </div>
        </div>
        <div class="mobile-nav" id="mobile-nav">
            <div id="cat-mobile"></div>
        </div>
    </nav>

    <!-- MAIN STORE -->
    <div id="main-store" style="display:none;">
        <div class="container" style="max-width:1200px; margin:auto;">
            <div id="product-grid" class="grid"></div>
        </div>
    </div>

    <!-- MODAL DETAIL PRODUK -->
    <div id="detail-modal" class="modal">
        <div class="modal-content">
            <button onclick="closeModal()" style="float:right; border:none; background:none; cursor:pointer;">&times;</button>
            <div class="slider" id="slider-img">
                <img src="" id="img-display">
            </div>
            <h2 id="det-nama">Nama Produk</h2>
            <p id="det-kat" style="color:var(--primary); font-size:0.9rem;"></p>
            <h3 id="det-harga" style="color:var(--accent); margin:10px 0;"></h3>
            <p id="det-desc" style="color:#666; margin-bottom:20px;"></p>
            <button onclick="addToCartDirect()" class="btn-glow" style="width:100%;">Tambah ke Keranjang</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
