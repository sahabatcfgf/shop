<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SahabatCFGF</title>
    <link rel="icon" type="image/png" href="sahabatcfgf.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <div id="main-store" style="display:none;">
        <nav class="navbar">
            <div class="container nav-flex">
                <h2 class="logo"><img src="sahabatcfgf.png" alt="Logo">Sahabat<span>CFGF</span></h2>
                <div class="nav-right">
                    <button class="btn-cart" onclick="toggleCart()">
                        <i class="fas fa-shopping-bag"></i> <span id="cart-count">0</span>
                    </button>
                    <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </nav>

        <div class="container store-layout">
            <main class="product-content">
                <div id="product-grid" class="grid"></div>
            </main>
        </div>
    </div>

    <div id="product-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content product-modal-content animate__animated animate__zoomIn">
            <button class="close-btn" onclick="closeProductModal()"><i class="fas fa-times"></i></button>
            
            <div class="slider-container" onclick="openLightbox()">
                <img id="modal-img" src="" alt="Gambar Produk">
                <button id="btn-prev" class="slider-btn left" onclick="event.stopPropagation(); prevSlide()"><i class="fas fa-chevron-left"></i></button>
                <button id="btn-next" class="slider-btn right" onclick="event.stopPropagation(); nextSlide()"><i class="fas fa-chevron-right"></i></button>
            </div>
            
            <h2 id="modal-title" style="margin-bottom: 5px;">Nama Produk</h2>
            <div id="modal-price" class="price-promo" style="font-size: 1.3rem; margin-bottom: 5px;">Rp 0</div>
            
            <div class="product-desc" id="modal-desc">Deskripsi produk...</div>
            
            <div style="margin-top: 15px;">
                <label style="display:block; margin-bottom: 8px; font-weight: bold; color: var(--dark);">
                    Jumlah Pembelian (Sisa Stok: <span id="modal-stock-text" style="color:var(--accent);">0</span>):
                </label>
                <input type="number" id="modal-qty" class="input-form" value="1" min="1" style="margin-bottom: 15px;">
                <input type="hidden" id="modal-kode">
                <button onclick="confirmAddToCart()" class="btn-glow w-100"><i class="fas fa-cart-plus"></i> Masukkan Keranjang</button>
            </div>
        </div>
    </div>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <img id="lightbox-img" src="" onclick="event.stopPropagation();">
    </div>

    <div id="cart-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content animate__animated animate__slideInRight" style="margin-left:auto; height:100vh; border-radius: 20px 0 0 20px; max-width: 420px;">
            <button class="close-btn" onclick="toggleCart()"><i class="fas fa-times"></i></button>
            <h2>Keranjang Belanja</h2>
            
            <div id="cart-items" style="max-height: 45vh; overflow-y: auto; margin-bottom: 10px;"></div>
            
            <div class="voucher-area">
                <input type="text" id="voucher-input" placeholder="Kode Voucher Diskon" class="input-form" style="margin-bottom:0;">
                <button type="button" onclick="applyVoucher()" class="btn-ghost" style="padding:10px 20px; white-space:nowrap; border-radius:10px;">Gunakan</button>
            </div>

            <div class="cart-summary">
                <div class="breakdown-row">
                    <span>Subtotal Produk:</span>
                    <span id="summary-subtotal">Rp 0</span>
                </div>
                <div class="breakdown-row" style="color: var(--accent);">
                    <span>Potongan Voucher:</span>
                    <span id="summary-discount">- Rp 0</span>
                </div>
                <div class="breakdown-row grand-total">
                    <span>Total Akhir:</span>
                    <span id="cart-total" style="color: var(--accent);">Rp 0</span>
                </div>
                <button onclick="checkout()" class="btn-glow w-100" style="margin-top: 15px;">Checkout Pesanan</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
